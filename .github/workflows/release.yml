name: Windows release

on:
  push:
    branches: [main]
    paths:
      - 'smartiptv/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - SmartIPTV.spec
      - windows-version.txt
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from smartiptv import __version__; print(__version__)"
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "name=SmartIPTV $version" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check provider and local library
        run: python -m unittest discover -s tests -v
      - name: Check interface, media resume and session restore
        run: python scripts/check_app.py
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm SmartIPTV.spec
      - name: Check packaged startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/SmartIPTV.exe -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id
            throw "Packaged app did not finish its startup check."
          }
          if ($process.ExitCode -ne 0) { throw "Packaged startup failed." }
      - name: Name download and checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $name = "SmartIPTV-$env:RELEASE_TAG-windows-x64.exe"
          Move-Item -LiteralPath dist/SmartIPTV.exe -Destination "dist/$name"
          $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartIPTV-windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release already exists; keeping its files unchanged."
            exit 0
          }
          gh release create $env:RELEASE_TAG "dist/SmartIPTV-$env:RELEASE_TAG-windows-x64.exe" dist/SHA256SUMS.txt THIRD_PARTY_NOTICES.md --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $env:RELEASE_NAME --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }
