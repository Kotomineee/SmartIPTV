name: Windows build

on:
  push:
    branches: [main]
    paths:
      - 'smartiptv/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - SmartIPTV.spec
      - windows-version.txt
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from smartiptv import __version__; print(__version__)"
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "name=SmartIPTV $version" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check provider and local library
        run: python -m unittest discover -s tests -v
      - name: Check interface, media resume and session restore
        run: python scripts/check_app.py
      - name: Check embedded player, tracks, settings and next episode
        run: python scripts/check_v110.py
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm SmartIPTV.spec
      - name: Check packaged startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/SmartIPTV.exe -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id
            throw "Packaged app did not finish its startup check."
          }
          if ($process.ExitCode -ne 0) { throw "Packaged startup failed." }
      - name: Name download and checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $name = "SmartIPTV-$env:RELEASE_TAG-windows-x64.exe"
          Move-Item -LiteralPath dist/SmartIPTV.exe -Destination "dist/$name"
          $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Copy-Item -LiteralPath THIRD_PARTY_NOTICES.md -Destination dist/THIRD_PARTY_NOTICES.md
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartIPTV-windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY_NOTICES.md
      # Publish manually through the owner's authenticated account. Releases
      # contain only their version title and attachments, with an empty body.
